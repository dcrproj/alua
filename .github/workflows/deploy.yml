name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sync backend
        run: |
          rsync -az --delete \
            --exclude='.env.local' \
            --exclude='var/' \
            --exclude='vendor/' \
            alua-backend/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/david/www/alua/alua-backend/

      - name: Sync frontend
        run: |
          rsync -az --delete \
            --exclude='.env.local' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            alua-frontend/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/david/www/alua/alua-frontend/

      - name: Post-deploy backend
        run: ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash /home/david/www/alua/scripts/deploy-backend.sh'

      - name: Post-deploy frontend
        run: ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash /home/david/www/alua/scripts/deploy-frontend.sh'
