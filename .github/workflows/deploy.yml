name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Configure SSH multiplexing
        run: |
          mkdir -p ~/.ssh/ctl
          cat >> ~/.ssh/config << EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            StrictHostKeyChecking no
            ControlMaster auto
            ControlPath ~/.ssh/ctl/%h_%p_%r
            ControlPersist 10m
          EOF
          ssh -fN vps

      - name: Sync backend
        run: |
          rsync -az --delete -e "ssh -o ControlPath=~/.ssh/ctl/%h_%p_%r" \
            --exclude='.env.local' \
            --exclude='var/' \
            --exclude='vendor/' \
            alua-backend/ vps:/home/david/www/alua/alua-backend/

      - name: Sync frontend
        run: |
          rsync -az --delete -e "ssh -o ControlPath=~/.ssh/ctl/%h_%p_%r" \
            --exclude='.env.local' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            alua-frontend/ vps:/home/david/www/alua/alua-frontend/

      - name: Sync scripts
        run: |
          rsync -az --delete -e "ssh -o ControlPath=~/.ssh/ctl/%h_%p_%r" \
            scripts/ vps:/home/david/www/alua/scripts/

      - name: Post-deploy backend
        run: ssh -o ControlPath=~/.ssh/ctl/%h_%p_%r vps 'bash /home/david/www/alua/scripts/deploy-backend.sh'

      - name: Post-deploy frontend
        run: ssh -o ControlPath=~/.ssh/ctl/%h_%p_%r vps 'bash /home/david/www/alua/scripts/deploy-frontend.sh'
