# Configuration Nginx — Geocopia (geocopia.fr)
#
# Structure réelle sur le VPS (deux fichiers) :
#
#   /etc/nginx/conf.d/geocopia-global.conf   ← directives http{} (real_ip + rate limiting)
#   /etc/nginx/sites-available/geocopia      ← server blocks uniquement
#
# Raison : set_real_ip_from et limit_req_zone doivent être au niveau http{},
# pas dans un server{} block. Et "geocopia_api" était déjà utilisé comme
# keys_zone FastCGI dans geocopia-cache.conf → conflit de nom → nouveaux noms rl_*.

# ============================================================
# Fichier 1 : /etc/nginx/conf.d/geocopia-global.conf
# ============================================================

# Extraire la vraie IP depuis l'en-tête Cloudflare.
# Sans ça, $binary_remote_addr = IP Cloudflare (partagée par tous les users)
# => le rate limiting s'applique à tous les visiteurs comme s'ils étaient un seul.
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Deux zones séparées : évite que les ~15 chunks JS d'une page Next.js
# épuisent le burst de l'API (anciennement zone unique partagée).
# Pages Next.js : 120r/m (2/s) avec burst pour les assets statiques
limit_req_zone $binary_remote_addr zone=rl_pages:10m rate=120r/m;
# API Symfony : 60r/m (1/s) avec burst suffisant pour les 5 fetches client-side
limit_req_zone $binary_remote_addr zone=rl_api:10m rate=60r/m;
# Les tuiles n'ont pas de rate limiting (MBTiles statiques, burst natif MapLibre ~50 tuiles)


# ============================================================
# Fichier 2 : /etc/nginx/sites-available/geocopia
# ============================================================

# API interne (appels serveur-side Next.js -> PHP-FPM, bypass Cloudflare)
server {
    listen 127.0.0.1:8081;
    server_name _;

    root /home/david/www/alua/alua-backend/public;

    location /api {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass            unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include                 fastcgi_params;
        fastcgi_param           SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param           DOCUMENT_ROOT   $realpath_root;
        fastcgi_read_timeout    30;
        internal;
    }
}

# Redirect www -> apex
server {
    listen 80;
    listen [::]:80;
    server_name www.geocopia.fr;
    return 301 https://geocopia.fr$request_uri;
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name geocopia.fr;
    return 301 https://geocopia.fr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name geocopia.fr;

    # SSL (géré par Certbot)
    ssl_certificate     /etc/letsencrypt/live/geocopia.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geocopia.fr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Sécurité
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Logs
    access_log /var/log/nginx/geocopia.access.log;
    error_log  /var/log/nginx/geocopia.error.log;

    # Tuiles vectorielles (martin, port 3000)
    location /tiles/ {
        proxy_pass         http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_cache_valid  200 1d;
        add_header         Cache-Control "public, max-age=86400, immutable";
    }

    # API Symfony (PHP-FPM 8.3)
    # Zone séparée rl_api : les chunks Next.js n'épuisent plus ce burst
    # burst=30 : couvre les 5 fetches client-side simultanées + marge
    location /api {
        limit_req zone=rl_api burst=30 nodelay;

        root  /home/david/www/alua/alua-backend/public;
        index index.php;

        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        root             /home/david/www/alua/alua-backend/public;
        fastcgi_pass     unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include          fastcgi_params;
        fastcgi_param    SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param    DOCUMENT_ROOT   $realpath_root;
        fastcgi_read_timeout 30;
        internal;
    }

    # Frontend Next.js (PM2, port 3001)
    location / {
        limit_req zone=rl_pages burst=60 nodelay;
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60;
    }
}

# Redirect www HTTPS -> apex HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.geocopia.fr;
    ssl_certificate     /etc/letsencrypt/live/geocopia.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geocopia.fr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://geocopia.fr$request_uri;
}
