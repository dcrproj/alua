# /etc/nginx/sites-available/geocopia
#
# Geocopia — vhost production
# geocopia.fr  →  Next.js (PM2, port 3000)
#               →  Symfony/API Platform (PHP-FPM 8.3)  sur /api
#               →  martin (port 3001)                  sur /tiles

# Zone de rate limiting : 60 req/min par IP
limit_req_zone $binary_remote_addr zone=geocopia:10m rate=60r/m;

# Redirect www → apex
server {
    listen 80;
    listen [::]:80;
    server_name www.geocopia.fr;
    return 301 https://geocopia.fr$request_uri;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name geocopia.fr;
    return 301 https://geocopia.fr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name geocopia.fr;

    # ── SSL (géré par Certbot) ──────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/geocopia.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geocopia.fr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Sécurité ────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Logs ────────────────────────────────────────────────────────
    access_log /var/log/nginx/geocopia.access.log;
    error_log  /var/log/nginx/geocopia.error.log;

    # ── Tuiles vectorielles (martin, port 3000) ─────────────────────
    location /tiles/ {
        limit_req zone=geocopia burst=30 nodelay;
        proxy_pass         http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_cache_valid  200 1d;
        add_header         Cache-Control "public, max-age=86400, immutable";
    }

    # ── API Symfony (PHP-FPM 8.3) ───────────────────────────────────
    location /api {
        limit_req zone=geocopia burst=20 nodelay;

        root  /home/david/www/alua/alua-backend/public;
        index index.php;

        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        root             /home/david/www/alua/alua-backend/public;
        fastcgi_pass     unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include          fastcgi_params;
        fastcgi_param    SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param    DOCUMENT_ROOT   $realpath_root;
        fastcgi_read_timeout 30;
        internal;
    }

    # ── Frontend Next.js (PM2, port 3001) ───────────────────────────
    location / {
        limit_req zone=geocopia burst=40 nodelay;
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60;
    }
}

# Redirect www HTTPS → apex HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.geocopia.fr;
    ssl_certificate     /etc/letsencrypt/live/geocopia.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geocopia.fr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://geocopia.fr$request_uri;
}
